<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sanket Sanath’s reading log, with books, ratings, and reading charts.">
    <title>Reading — Sanket Sanath</title>
    <link rel="stylesheet" href="../css_n_js/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css_n_js/css/nav-left.css">
    <link rel="stylesheet" href="../css_n_js/css/style.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.0/css/all.css"
          integrity="sha384-Mmxa0mLqhmOeaE8vgOSbKacftZcsNYDjQzuCOm6D02luYSzBG8vpaOykv9lFQ51Y" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reading.css">
    <script defer src="books-data.js"></script>
    <script defer src="reading.js"></script>
</head>
<body>
    <a class="reading-skip" href="#reading-main">Skip to reading log</a>
    <nav class="navbar navbar-expand-md navbar-dark bg-nav-col fixed-left justify-content-md-center reading-nav" aria-label="Portfolio">
        <a class="navbar-brand" href="../index.html">
            <img width="30" height="30" src="../images/base2withcolor.svg" alt=""> Sanket Sanath
        </a>
        <button class="navbar-toggler" type="button" aria-controls="reading-navigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="reading-navigation">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="../index.html"><i class="fas fa-home" aria-hidden="true"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link" href="https://chaurahasite.wordpress.com/"><i class="fas fa-blog" aria-hidden="true"></i> Blog</a></li>
                <li class="nav-item"><a class="nav-link" href="../books.html"><i class="fas fa-book-open" aria-hidden="true"></i> Books</a></li>
                <li class="nav-item active"><a class="nav-link" href="index.html" aria-current="page"><i class="fas fa-bookmark" aria-hidden="true"></i> Reading</a></li>
                <li class="nav-item"><a class="nav-link" href="../exploration/index.html"><i class="fas fa-compass" aria-hidden="true"></i> Exploration</a></li>
                <li class="nav-item">
                    <div id="smprofiles">
                        <a href="https://www.linkedin.com/in/sanketsanath" aria-label="LinkedIn"><i class="fab fa-linkedin-in dedh" aria-hidden="true"></i></a>
                        <a href="https://github.com/SanketSanath" aria-label="GitHub"><i class="fab fa-github dedh" aria-hidden="true"></i></a>
                        <a href="mailto:sanathsanket@gmail.com" aria-label="Email"><i class="fas fa-envelope dedh" aria-hidden="true"></i></a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <main class="reading-main" id="reading-main" tabindex="-1">
        <header class="reading-header">
            <div>
                <h1>Reading</h1>
                <hr class="reading-divider">
            </div>
            <nav class="reading-views" aria-label="Reading views">
                <a href="#list" data-view="list" aria-current="page">Book list</a>
                <a href="#charts" data-view="charts">Charts</a>
            </nav>
        </header>

        <dl class="reading-stats" aria-label="Reading totals">
            <div><dt>Books logged</dt><dd id="stat-total">—</dd></div>
            <div><dt id="stat-year-label">Read this year</dt><dd id="stat-year">—</dd></div>
            <div><dt>Average rating</dt><dd id="stat-avg">—</dd></div>
            <div><dt>Authors</dt><dd id="stat-authors">—</dd></div>
        </dl>

        <section class="reading-controls" aria-label="Reading filters">
            <div class="reading-toolbar">
                <div class="reading-search">
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input id="search-input" type="search" placeholder="Search title or author…" aria-label="Search by title or author" autocomplete="off">
                </div>
                <div class="reading-group" id="reading-group" role="group" aria-label="Group by">
                    <button class="reading-group-button" type="button" data-group="" aria-pressed="true">All</button>
                    <button class="reading-group-button" type="button" data-group="year" aria-pressed="false">Year</button>
                    <button class="reading-group-button" type="button" data-group="author" aria-pressed="false">Author</button>
                    <button class="reading-group-button" type="button" data-group="genre" aria-pressed="false">Genre</button>
                    <button class="reading-group-button" type="button" data-group="language" aria-pressed="false">Language</button>
                </div>
                <div class="reading-count" id="reading-count" role="status"></div>
            </div>
            <div class="reading-filters">
                <span class="reading-filter-label" aria-hidden="true">Filter</span>
                <select id="filter-year" data-filter="year" aria-label="Filter by year"><option value="">All years</option></select>
                <select id="filter-author" data-filter="author" aria-label="Filter by author"><option value="">All authors</option></select>
                <select id="filter-genre" data-filter="genre" aria-label="Filter by genre"><option value="">All genres</option></select>
                <select id="filter-language" data-filter="language" aria-label="Filter by language"><option value="">All languages</option></select>
                <button class="clear-reading-filters" id="clear-filters" type="button" hidden>Clear filters</button>
            </div>
        </section>

        <div id="reading-results" tabindex="-1">
            <noscript><p class="reading-empty">Enable JavaScript to browse the reading log and charts.</p></noscript>
        </div>
    </main>
</body>
</html>
