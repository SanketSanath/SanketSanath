    <style>
        /* ── Layout ── */
        body {
            font-family: 'Raleway', sans-serif;
            background: #f9f9f9;
        }

        /* offset for fixed left navbar on desktop, top navbar on mobile */
        .page-wrapper {
            padding-left: 20px;
        }

        @media (max-width: 767px) {
            .page-wrapper {
                padding-left: 0;
                padding-top: 56px;
            }
        }

        /* ── Section shells ── */
        .expl-section {
            padding: 70px 40px;
        }

        .expl-section:nth-child(even) {
            background: #fff;
        }

        .expl-section:nth-child(odd) {
            background: #f9f9f9;
        }

        .section-heading {
            font-family: 'Work Sans', sans-serif;
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .section-sub {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .section-divider {
            border: 0;
            height: 3px;
            background: #D3D3D3;
            max-width: 80px;
            margin: 0 0 40px 0;
        }

        /* ── Motion ── */
        @keyframes section-rise {
            from { opacity: 0; transform: translateY(48px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes divider-grow {
            from { opacity: 0; transform: scaleX(0); }
            to { opacity: 1; transform: scaleX(1); }
        }

        @keyframes card-settle {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes detail-unfold {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .motion-ready .expl-section { opacity: 0; transform: translateY(48px); }
        .motion-ready .expl-section.is-visible {
            animation: section-rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            animation-delay: var(--section-delay, 0ms);
        }

        .motion-ready .expl-section.is-visible .section-divider {
            animation: divider-grow 0.79s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            transform-origin: left center;
        }

        .motion-ready .expl-section.is-visible .flag-card,
        .motion-ready .expl-section.is-visible .adventure-item,
        .motion-ready .expl-section.is-visible .timeline-entry {
            animation: card-settle 0.64s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            animation-delay: var(--item-delay, 0ms);
        }

        /* ── 1. INDIA MAP ── */
        #map-wrapper {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        #map-svg-container {
            flex: 1;
            min-height: 480px;
            background: #f1f6fa;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: box-shadow 0.35s ease, transform 0.35s ease;
        }

        @media (hover: hover) {
            #map-svg-container:hover {
                box-shadow: 0 16px 34px rgba(49, 131, 225, 0.13);
                transform: translateY(-2px);
            }
        }

        #map-svg-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #map-places-list {
            width: 240px;
            flex-shrink: 0;
            max-height: 520px;
            overflow-y: auto;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        #map-places-list .list-head {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #666;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: #fff;
        }

        .place-row {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
            cursor: default;
            transition: background 0.15s;
        }

        .place-row:hover {
            background: #f9f9f9;
        }

        .place-row .pr-icon {
            font-size: 14px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .place-row .pr-name {
            font-weight: 600;
            color: #222;
            line-height: 1.2;
        }

        .place-row .pr-state {
            font-size: 11px;
            color: #999;
        }

        @media (max-width: 767px) {
            #map-wrapper {
                flex-direction: column;
            }

            #map-places-list {
                width: 100%;
                max-height: 260px;
            }

            #map-svg-container {
                width: 100%;
                min-height: 340px;
                flex: none;
            }

            .expl-section {
                padding: 50px 20px;
            }
        }

        /* ── 2. WORLD FLAGS ── */
        .world-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
        }

        .flag-subsection h5 {
            font-family: 'Work Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 16px;
        }

        .flags-row {

            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .flag-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 80px;
        }

        .flag-emoji {
            font-size: 2.8rem;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
            transition: transform 0.2s;
        }

        .flag-emoji:hover {
            transform: scale(1.15);
        }

        .flag-name {
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-align: center;
        }

        .flag-card.next .flag-emoji {
            filter: grayscale(0.6) drop-shadow(0 2px 4px rgba(0,0,0,0.10));
            opacity: 0.6;
        }

        .flag-card.next .flag-name {
            color: #aaa;
        }

        .next-badge {
            display: inline-block;
            font-size: 9px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 4px;
            padding: 1px 5px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* ── 3. BUCKET LIST ── */
        .bucket-cols {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .bucket-col {
            flex: 1;
            min-width: 260px;
        }

        .bucket-col h4 {
            font-family: 'Work Sans', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            margin-bottom: 20px;
        }

        .adventure-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .adventure-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .adventure-item.done {
            background: #fff;
            border: 1px solid #e0e0e0;

        .adventure-item.todo {

            border: 1px solid #ffe0b2;
        }

            line-height: 1;

            margin-top: 2px;

        .adv-body {}

        .adv-name {

            font-weight: 700;

            line-height: 1.3;

        .trip-route {

            flex-wrap: wrap;

            font-size: 14px;
            gap: 5px;
            line-height: 1.65;
            margin-bottom: 14px;

        .trip-stop {
            font-weight: 400;

        .trip-route-arrow { color: #999; }

            margin: 0;
            color: #555;
            font-size: 14px;
            line-height: 1.65;

        /* ── TRAVEL TIMELINE ── */
        .travel-timeline {
            max-width: 900px;
            position: relative;
        }

        .travel-timeline.is-collapsed {
            max-height: 520px;
            overflow: hidden;
        }

        .travel-timeline.is-collapsed::after {
            background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 88%);
            bottom: 0;
            content: "";
            height: 96px;
            left: 0;
            pointer-events: none;
            position: absolute;
            right: 0;
        }

        .timeline-year + .timeline-year { margin-top: 28px; }

        .timeline-year-heading {
            color: #236aa9;
            font-family: 'Work Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 10px;
        }

        .timeline-items {
            border-left: 2px solid #c6e2f7;
            display: grid;
            gap: 3px;
            margin-left: 8px;
            padding-left: 22px;
        }

        .timeline-item {
            align-items: baseline;
            background: transparent;
            border: 0;
            color: inherit;
            cursor: pointer;
            display: grid;
            font: inherit;
            gap: 14px;
            grid-template-columns: 44px minmax(0, 1fr);
            padding: 8px 0;
            position: relative;
            text-align: left;
        }

        .timeline-item::before {
            background: #3183e1;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px #c6e2f7;
            content: "";
            height: 10px;
            left: -29px;
            position: absolute;
            top: 13px;
            width: 10px;
        }

        .timeline-item:hover .timeline-title,
        .timeline-item:focus-visible .timeline-title { color: #236aa9; }

        .timeline-item:focus { outline: none; }

        .timeline-item:focus-visible {
            border-radius: 5px;
            outline: 3px solid #3183e1;
            outline-offset: 2px;
        }

        .timeline-month {
            color: #888;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
        }

        .timeline-title {
            color: #222;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.15s;
        }

        .timeline-label {
            color: #888;
            display: block;
            font-size: 12px;
            margin-top: 2px;
        }

        .timeline-panel {
            border-top: 1px solid #eee;
            margin: 2px 0 10px 58px;
            padding: 14px 0 4px;
        }

        .timeline-panel[hidden] { display: none; }
        .timeline-panel.is-opening { animation: detail-unfold 0.46s ease-out both; }
        .timeline-panel .trip-route { margin-bottom: 14px; }

        .timeline-section-toggle {
            background: transparent;
            border: 0;
            color: #236aa9;
            cursor: pointer;
            font: 600 13px 'Work Sans', sans-serif;
            margin-top: 16px;
            padding: 8px 0;
        }

        .timeline-section-toggle:hover { color: #174b78; }
        .timeline-section-toggle:focus { outline: none; }
        .timeline-section-toggle:focus-visible { outline: 3px solid #3183e1; outline-offset: 3px; }

        @media (max-width: 767px) {
            .timeline-items { padding-left: 18px; }
            .timeline-panel { margin-left: 58px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* map tooltip */
        #expl-tooltip {
            position: fixed;
            background: rgba(20,20,20,0.88);
            color: #fff;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 9999;
            line-height: 1.5;
        }
    </style>

    <script>

    <script>
        const INDIA_STATES_GEOJSON_URL = "https://gist.githubusercontent.com/jbrobst/56c13bbbf9d97d187fea01ca62ea5112/raw/e388c4cae20aa53cb5090210a42ebb9b765c0a36/india_states.geojson";
        const NEPAL_GEOJSON_URL = "https://raw.githubusercontent.com/Acesmndr/nepal-geojson/master/generated-geojson/nepal-acesmndr.geojson";

        const svg     = d3.select("#india-svg");
        const tooltip = d3.select("#expl-tooltip");
        let mapRevealPlayed = false;
        let mapRevealObserver = null;
        let mapRenderVersion = 0;

        // ── Build sidebar list ────────────────────────────────────────────
        const listBody = document.getElementById("places-list-body");
        document.getElementById("places-count").textContent = `(${VISITED_PLACES.length})`;

        VISITED_PLACES.forEach((p, i) => {
            const row = document.createElement("div");
            row.className = "place-row";
            row.dataset.index = i;
            row.innerHTML = `<span class="pr-icon">📍</span>
                             <div><div class="pr-name">${p.name}</div>
                             <div class="pr-state">${p.state}</div></div>`;
            listBody.appendChild(row);
        });

        function highlightRow(idx) {
            document.querySelectorAll(".place-row").forEach(r => r.style.background = "");
            const el = listBody.querySelector(`[data-index="${idx}"]`);
            if (el) {
                el.style.background = "#fff8e1";
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        }

        function prepareMapReveal(container, scratchReveals, boundaryPaths, renderVersion) {
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (reducedMotion || !("IntersectionObserver" in window) || mapRevealPlayed) return;

            const scratchTransform = (reveal, scale) => {
                const [centerX, centerY] = reveal.polygon
                    ? d3.polygonCentroid(reveal.polygon)
                    : [reveal.x + reveal.width / 2, reveal.y + reveal.height / 2];
                return `translate(${centerX} ${centerY}) scale(${scale}) translate(${-centerX} ${-centerY})`;
            };

            scratchReveals.attr("transform", reveal => scratchTransform(reveal, 0));
            boundaryPaths.each(function () {
                const length = this.getTotalLength();
                d3.select(this)
                    .attr("stroke-dasharray", `${length} ${length}`)
                    .attr("stroke-dashoffset", length);
            });

            const mapTargets = svg.selectAll(".visited-place-targets *, .visited-area-targets *")
                .style("pointer-events", "none");
            const startReveal = () => {
                if (renderVersion !== mapRenderVersion || mapRevealPlayed) return;
                mapRevealPlayed = true;

                boundaryPaths.transition("map-boundary-trace")
                    .duration(720)
                    .ease(d3.easeCubicInOut)
                    .attr("stroke-dashoffset", 0);

                window.setTimeout(() => {
                    if (renderVersion !== mapRenderVersion) return;
                    scratchReveals.transition("map-scratch-reveal")
                        .delay((_, index) => Math.min(index * 55, 550))
                        .duration(280)
                        .ease(d3.easeCubicOut)
                        .attr("transform", reveal => scratchTransform(reveal, 1));

                    window.setTimeout(() => {
                        if (renderVersion === mapRenderVersion) mapTargets.style("pointer-events", null);
                    }, 850);
                }, 740);
            };

            if (mapRevealObserver) mapRevealObserver.disconnect();
            mapRevealObserver = new IntersectionObserver(entries => {
                if (!entries.some(entry => entry.isIntersecting)) return;
                mapRevealObserver.disconnect();
                mapRevealObserver = null;
                startReveal();
            }, { threshold: 1 });
            mapRevealObserver.observe(container);
        }

        // ── Map render ────────────────────────────────────────────────────
        function renderIndiaMap(indiaData, nepalData) {
            const renderVersion = ++mapRenderVersion;
            const container = document.getElementById("map-svg-container");
            const W = container.clientWidth;
            const H = container.clientHeight || Math.max(420, W * 0.85);

            const scale = Math.min(W, H) * 1.5; // map padding
            const projection = d3.geoMercator()
                .center([82, 22])
                .scale(scale)
                .translate([W * 0.44, H * 0.52]);

            const path = d3.geoPath().projection(projection);

            svg.attr("width", W).attr("height", H);
            svg.selectAll("*").remove();

            // The map is built in three layers: a gradient base, the muted
            // coating, and state outlines drawn above both. Visited places
            // punch compact square reveals through the coating.
            const scratchSize = Math.max(7, Math.min(W, H) * 0.014);
            const defs = svg.append("defs");
            const gradient = defs.append("linearGradient")
                .attr("id", "visited-gradient")
                .attr("gradientUnits", "userSpaceOnUse")
                .attr("x1", 0).attr("y1", H)
                .attr("x2", W).attr("y2", 0);

            <!--     Use 0, 25, 50, 75, 100       -->
            gradient.append("stop").attr("offset", "30%").attr("stop-color", "#4f42a5");
            gradient.append("stop").attr("offset", "40%").attr("stop-color", "#7c3aed");
            gradient.append("stop").attr("offset", "50%").attr("stop-color", "#2563eb");
            gradient.append("stop").attr("offset", "60%").attr("stop-color", "#06b6d4");
            gradient.append("stop").attr("offset", "70%").attr("stop-color", "#0fd0ed");

            const gradientBorder = defs.append("linearGradient")
                .attr("id", "visited-gradient-border")
                .attr("gradientUnits", "userSpaceOnUse")
                .attr("x1", 0).attr("y1", H)
                .attr("x2", W).attr("y2", 0);

            gradientBorder.append("stop").attr("offset", "30%").attr("stop-color", "#180d68");
            gradientBorder.append("stop").attr("offset", "40%").attr("stop-color", "#5723b3");
            gradientBorder.append("stop").attr("offset", "50%").attr("stop-color", "#1747ae");
            gradientBorder.append("stop").attr("offset", "60%").attr("stop-color", "#087f98");
            gradientBorder.append("stop").attr("offset", "70%").attr("stop-color", "#1298ad");

            const mask = defs.append("mask")
                .attr("id", "visited-reveal-mask")
                .attr("maskUnits", "userSpaceOnUse")
                .attr("x", 0).attr("y", 0).attr("width", W).attr("height", H);

            mask.append("rect")
                .attr("class", "mask-coating")
                .attr("width", W).attr("height", H)
                .attr("fill", "white");

            const pointReveals = VISITED_PLACES.map((place, index) => {
                const [x, y] = projection([place.lng, place.lat]);
                return {
                    ...place,
                    kind: "place",
                    placeIndex: index,
                    x: x - scratchSize / 2,
                    y: y - scratchSize / 2,
                    width: scratchSize,
                    height: scratchSize
                };
            });

            const areaReveals = VISITED_AREAS.flatMap(area => {
                if (!Array.isArray(area.points) || area.points.length < 4) return [];
                return [{
                    ...area,
                    kind: "area",
                    polygon: area.points.map(point => projection([point.lng, point.lat]))
                }];
            });

            mask.selectAll("rect.scratch-reveal")
                .data(pointReveals)
                .enter().append("rect")
                .attr("class", "scratch-reveal")
                .attr("x", d => d.x)
                .attr("y", d => d.y)
                .attr("width", d => d.width)
                .attr("height", d => d.height)
                .attr("fill", "black");

            mask.selectAll("polygon.area-scratch-reveal")
                .data(areaReveals)
                .enter().append("polygon")
                .attr("class", "area-scratch-reveal")
                .attr("points", d => d.polygon.map(point => point.join(",")).join(" "))
                .attr("fill", "black");

            // The Nepal source uses the opposite polygon winding from D3's
            // spherical GeoJSON convention. Reverse its exterior ring so the
            // country itself is filled instead of the surrounding canvas.
            const nepalShape = {
                ...nepalData,
                geometry: {
                    ...nepalData.geometry,
                    coordinates: nepalData.geometry.coordinates.map(ring => [...ring].reverse())
                }
            };

            // India retains its state-level boundaries; Nepal is rendered as
            // one additional country shape so Nepal visits can be scratched too.
            const mapShapes = [
                ...indiaData.features.map(feature => ({ ...feature, mapCountry: "india" })),
                { ...nepalShape, mapCountry: "nepal" }
            ];
            const statePaths = selection => selection
                .data(mapShapes)
                .enter().append("path")
                .attr("d", path)
                .attr("fill-rule", "evenodd");

            statePaths(svg.append("g").attr("class", "map-gradient-layer").selectAll("path"))
                .attr("fill", "url(#visited-gradient)");

            statePaths(svg.append("g").attr("class", "map-gradient-boundaries").selectAll("path"))
                .attr("fill", "none")
                .attr("stroke", "url(#visited-gradient-border)")
                .attr("stroke-width", 0.65)
                .attr("vector-effect", "non-scaling-stroke");

            statePaths(svg.append("g")
                .attr("class", "map-coating-layer")
                .attr("mask", "url(#visited-reveal-mask)")
                .selectAll("path"))
                .attr("fill", d => d.mapCountry === "nepal" ? "#EBF8FF" : "#d8ecfa");

            statePaths(svg.append("g")
                .attr("class", "map-boundaries")
                .attr("mask", "url(#visited-reveal-mask)")
                .selectAll("path"))
                .attr("fill", "none")
                .attr("stroke", "#7ab8d9")
                .attr("stroke-width", 0.65)
                .attr("vector-effect", "non-scaling-stroke");

            // Invisible hit areas retain useful tooltips without adding visible
            // markers above the scratch reveals. Area reveals use one target,
            // so nearby places do not create a stack of competing hover labels.
            svg.append("g").attr("class", "visited-place-targets").selectAll("rect")
                .data(pointReveals)
                .enter().append("rect")
                .attr("x", d => d.x)
                .attr("y", d => d.y)
                .attr("width", d => d.width)
                .attr("height", d => d.height)
                .attr("fill", "transparent")
                .style("cursor", "pointer")
                .on("mouseover", (event, d) => {
                    tooltip.style("display", "block")
                        .html(`<strong>${d.name}</strong><br>${d.state}`);
                })
                .on("mousemove", event => {
                    tooltip.style("left", (event.clientX + 14) + "px")
                           .style("top",  (event.clientY - 34) + "px");
                })
                .on("mouseout", event => {
                    tooltip.style("display", "none");
                })
                .on("click", (event, d) => {
                    highlightRow(d.placeIndex);
                });

            svg.append("g").attr("class", "visited-area-targets").selectAll("polygon")
                .data(areaReveals)
                .enter().append("polygon")
                .attr("points", d => d.polygon.map(point => point.join(",")).join(" "))
                .attr("fill", "transparent")
                .style("cursor", "pointer")
                .on("mouseover", (event, d) => {
                    tooltip.style("display", "block")
                        .html(`<strong>${d.name}</strong><br>${d.state}`);
                })
                .on("mousemove", event => {
                    tooltip.style("left", (event.clientX + 14) + "px")
                           .style("top",  (event.clientY - 34) + "px");
                })
                .on("mouseout", event => {
                    tooltip.style("display", "none");
                });

            prepareMapReveal(
                container,
                mask.selectAll(".scratch-reveal, .area-scratch-reveal"),
                svg.selectAll(".map-gradient-boundaries path, .map-boundaries path"),
                renderVersion
            );
        }

        // ── Trip stories ─────────────────────────────────────────────────
        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
            })[char]);
        }

        function parseMonth(value) {
            const match = /^(\d{4})-(0[1-9]|1[0-2])$/.exec(value || "");
            if (!match) return null;
            return {
                year: Number(match[1]),
                month: Number(match[2]),
                sortValue: Number(match[1]) * 12 + Number(match[2])
            };
        }

        function formatMonth({ month }) {
            return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][month - 1];
        }

        function renderTravelTimeline() {
            const section = document.getElementById("travel-timeline-section");
            const container = document.getElementById("travel-timeline");
            const sectionToggle = document.getElementById("timeline-section-toggle");
            const datedTrips = TRIPS.map((trip, index) => ({
                ...trip,
                dateInfo: parseMonth(trip.date),
                panelId: `timeline-story-${index}`
            }))
                .filter(trip => trip.dateInfo && trip.title)
                .sort((a, b) => b.dateInfo.sortValue - a.dateInfo.sortValue);

            section.hidden = datedTrips.length === 0;
            if (!datedTrips.length) {
                container.innerHTML = "";
                sectionToggle.hidden = true;
                return;
            }

            const tripsByYear = datedTrips.reduce((groups, trip) => {
                (groups[trip.dateInfo.year] ||= []).push(trip);
                return groups;
            }, {});

            const years = Object.keys(tripsByYear).sort((a, b) => b - a);
            container.innerHTML = years.map(year => {
                const trips = tripsByYear[year];
                return `
                <div class="timeline-year">
                    <h3 class="timeline-year-heading">${year}</h3>
                    <div class="timeline-items">
                        ${trips.map((trip, index) => {
                            const panelId = trip.panelId;
                            const route = Array.isArray(trip.route) ? trip.route.map((stop, index) =>
                                `${index ? '<span class="trip-route-arrow" aria-hidden="true">→</span>' : ""}<span class="trip-stop">${escapeHtml(stop)}</span>`
                            ).join("") : "";
                            const story = String(trip.story || "").trim()
                                ? `<p class="trip-story">${escapeHtml(trip.story)}</p>` : "";
                            return `<div class="timeline-entry" style="--item-delay:${Math.min(index * 55, 330)}ms">
                                <button class="timeline-item" type="button" aria-expanded="false" aria-controls="${escapeHtml(panelId)}">
                                    <span class="timeline-month">${formatMonth(trip.dateInfo)}</span>
                                    <span><span class="timeline-title">${escapeHtml(trip.title)}</span><span class="timeline-label">${escapeHtml(trip.label || "")}</span></span>
                                </button>
                                <div class="timeline-panel" id="${escapeHtml(panelId)}" hidden>
                                    ${route ? `<div class="trip-route">${route}</div>` : ""}
                                    ${story}
                                </div>
                            </div>`;
                        }).join("")}
                    </div>
                </div>`;
            }).join("");

            const collapsedHeight = 520;
            const needsToggle = container.scrollHeight > collapsedHeight;
            sectionToggle.hidden = !needsToggle;
            if (needsToggle) {
                let isCollapsed = true;
                const updateSectionToggle = () => {
                    container.classList.toggle("is-collapsed", isCollapsed);
                    sectionToggle.setAttribute("aria-expanded", String(!isCollapsed));
                    sectionToggle.textContent = isCollapsed
                        ? `Show all ${datedTrips.length} trips`
                        : "Collapse timeline";
                };
                updateSectionToggle();
                sectionToggle.onclick = () => {
                    isCollapsed = !isCollapsed;
                    updateSectionToggle();
                };
            } else {
                container.classList.remove("is-collapsed");
                sectionToggle.onclick = null;
            }

            container.querySelectorAll(".timeline-item").forEach(item => {
                item.addEventListener("click", () => {
                    const willExpand = item.getAttribute("aria-expanded") !== "true";
                    container.querySelectorAll(".timeline-item").forEach(otherItem => {
                        otherItem.setAttribute("aria-expanded", "false");
                        const otherPanel = document.getElementById(otherItem.getAttribute("aria-controls"));
                        otherPanel.hidden = true;
                        otherPanel.classList.remove("is-opening");
                    });
                    if (willExpand) {
                        item.setAttribute("aria-expanded", "true");
                        const panel = document.getElementById(item.getAttribute("aria-controls"));
                        panel.hidden = false;
                        panel.classList.remove("is-opening");
                        requestAnimationFrame(() => panel.classList.add("is-opening"));
                    }
                });
            });
        }

        function initializeExplorationMotion() {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;

            document.body.classList.add("motion-ready");
            document.querySelectorAll(".expl-section").forEach((section, index) => {
                section.style.setProperty("--section-delay", `${Math.min(index * 70, 210)}ms`);
            });
            document.querySelectorAll(".flag-card, .adventure-item").forEach((item, index) => {
                item.style.setProperty("--item-delay", `${Math.min(index * 45, 315)}ms`);
            });

            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    entry.target.classList.add("is-visible");
                    observer.unobserve(entry.target);
                });
            }, { threshold: 0.12 });

            document.querySelectorAll(".expl-section").forEach(section => observer.observe(section));
        }

        function renderWorldFlags() {
            document.getElementById("world-flags").innerHTML = WORLD_FLAGS.map(group => `
                <div class="flag-subsection">
                    <h5>${escapeHtml(group.title)}</h5>
                    <div class="flags-row">${group.countries.map(country => `
                        <div class="flag-card${country.next ? " next" : ""}">
                            <span class="flag-emoji">${escapeHtml(country.flag)}</span>
                            <span class="flag-name">${escapeHtml(country.name)}</span>
                            ${country.next ? '<span class="next-badge">NEXT</span>' : ""}
                        </div>`).join("")}
                    </div>
                </div>`).join("");
        }

        function renderBucketList() {
            document.getElementById("bucket-list").innerHTML = BUCKET_LIST.map(group => `
                <div class="bucket-col">
                    <h4>${escapeHtml(group.title)}</h4>
                    ${group.items.map(item => `
                        <div class="adventure-item ${escapeHtml(group.status)}">
                            <div class="adv-emoji">${escapeHtml(item.emoji)}</div>
                            <div class="adv-body">
                                <div class="adv-name">${escapeHtml(item.name)}</div>
                                ${item.place ? `<div class="adv-place">${escapeHtml(item.place)}</div>` : ""}
                            </div>
                        </div>`).join("")}
                </div>`).join("");
        }

        renderWorldFlags();
        renderTravelTimeline();
        renderBucketList();
        initializeExplorationMotion();

        // ── Load & resize ─────────────────────────────────────────────────
        Promise.all([
            d3.json(INDIA_STATES_GEOJSON_URL),
            d3.json(NEPAL_GEOJSON_URL)
        ]).then(([indiaData, nepalData]) => {
            // set container height = 85% of its width for nice aspect ratio
            const container = document.getElementById("map-svg-container");
            container.style.height = Math.max(420, container.clientWidth * 0.85) + "px";

            renderIndiaMap(indiaData, nepalData);

            let t;
            window.addEventListener("resize", () => {
                clearTimeout(t);
                t = setTimeout(() => {
                    container.style.height = Math.max(420, container.clientWidth * 0.85) + "px";
                    renderIndiaMap(indiaData, nepalData);
                }, 150);
            });
        });
    </script>

</body>
