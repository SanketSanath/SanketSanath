    <style>
        /* ── Layout ── */
        body {
            font-family: 'Raleway', sans-serif;
            background: #f9f9f9;
        }

        /* offset for fixed left navbar on desktop, top navbar on mobile */
        .page-wrapper {
            padding-left: 20px;
        }

        @media (max-width: 767px) {
            .page-wrapper {
                padding-left: 0;
                padding-top: 56px;
            }
        }

        /* ── Section shells ── */
        .expl-section {
            padding: 70px 40px;
        }

        .expl-section:nth-child(even) {
            background: #fff;
        }

        .expl-section:nth-child(odd) {
            background: #f9f9f9;
        }

        .section-heading {
            font-family: 'Work Sans', sans-serif;
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .section-sub {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .section-divider {
            border: 0;
            height: 3px;
            background: #D3D3D3;
            max-width: 80px;
            margin: 0 0 40px 0;
        }

        /* ── 1. INDIA MAP ── */
        #map-wrapper {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        #map-svg-container {
            flex: 1;
            min-height: 480px;
            background: #f1f6fa;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #map-svg-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #map-places-list {
            width: 240px;
            flex-shrink: 0;
            max-height: 520px;
            overflow-y: auto;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        #map-places-list .list-head {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #666;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: #fff;
        }

        .place-row {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
            cursor: default;
            transition: background 0.15s;
        }

        .place-row:hover {
            background: #f9f9f9;
        }

        .place-row .pr-icon {
            font-size: 14px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .place-row .pr-name {
            font-weight: 600;
            color: #222;
            line-height: 1.2;
        }

        .place-row .pr-state {
            font-size: 11px;
            color: #999;
        }

        @media (max-width: 767px) {
            #map-wrapper {
                flex-direction: column;
            }

            #map-places-list {
                width: 100%;
                max-height: 260px;
            }

            #map-svg-container {
                width: 100%;
                min-height: 340px;
                flex: none;
            }

            .expl-section {
                padding: 50px 20px;
            }
        }

        /* ── 2. WORLD FLAGS ── */
        .world-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
        }

        .flag-subsection h5 {
            font-family: 'Work Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 16px;
        }

        .flags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .flag-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 80px;
        }

        .flag-emoji {
            font-size: 2.8rem;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
            transition: transform 0.2s;
        }

        .flag-emoji:hover {
            transform: scale(1.15);
        }

        .flag-name {
            font-size: 11px;
            font-weight: 600;
            color: #555;
            text-align: center;
        }

        .flag-card.next .flag-emoji {
            filter: grayscale(0.6) drop-shadow(0 2px 4px rgba(0,0,0,0.10));
            opacity: 0.6;
        }

        .flag-card.next .flag-name {
            color: #aaa;
        }

        .next-badge {
            display: inline-block;
            font-size: 9px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 4px;
            padding: 1px 5px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .bucket-cols {

            gap: 56px;
            flex-wrap: wrap;
            max-width: 900px;
        }

        .bucket-col {

            min-width: 260px;

        .log-group-heading {

            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #5a6680;

        .adventure-item {
            display: flex;
            align-items: flex-start;
            gap: 13px;
            padding: 10px 0;
            margin: 0;
        }

        .adventure-item:hover { background: transparent; }

        .adv-marker {
            width: 10px;
            height: 10px;
            margin-top: 5px;
            flex: 0 0 10px;
            border: 1.5px solid #596b8c;
        }

        .adventure-item.done .adv-marker {
            border: 0;
            background: linear-gradient(135deg, #5b43c4, #369ed6);
        }

        .adv-body { min-width: 0; }

        .adv-name {
            font-family: 'Work Sans', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #222;
            line-height: 1.3;
        }

        .adv-place {
            font-size: 12px;
            color: #87909f;
            margin-top: 4px;
        }

        .adv-art {
            width: 56px;
            height: 46px;
            margin: -2px 2px -2px 0;
            flex: 0 0 56px;
            color: #90a9c6;
            opacity: 0.8;
        }

        .adventure-item.done .adv-art { color: #6872bb; }

        .adv-art svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.45;
        }

        /* ── 3. TRIP STORIES ── */
        .trip-stories {
            display: grid;
            gap: 14px;
            max-width: 900px;
        }

        .trip-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }

        .trip-toggle {
            width: 100%;
            border: 0;
            -webkit-appearance: none;
            appearance: none;
            background: #fff;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            cursor: pointer;
            font: inherit;
        }

        .trip-toggle:hover,
        .trip-toggle:focus-visible {
            background: #f7fbff;
            outline: none;
        }

        .trip-toggle:focus-visible {
            box-shadow: inset 0 0 0 3px #3183e1;
        }

        .trip-title-wrap { flex: 1; }

        .trip-label {
            display: block;
            font-size: 11px;
            color: #888;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .trip-title {
            display: block;
            color: #222;
            font-family: 'Work Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .trip-chevron {
            color: #3183e1;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .trip-toggle[aria-expanded="true"] .trip-chevron { transform: rotate(180deg); }

        .trip-panel {
            border-top: 1px solid #eee;
            padding: 20px 22px 22px;
        }

        .trip-panel[hidden] { display: none; }

        .trip-route {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 20px;
        }

        .trip-panel .trip-route:last-child { margin-bottom: 0; }

        .trip-stop {
            background: #eaf4fd;
            border-radius: 20px;
            color: #236aa9;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 10px;
        }

        .trip-route-arrow { color: #9bbbd6; }

        .trip-story {
            margin: 0 0 20px;
            color: #555;
            font-size: 14px;
            line-height: 1.65;
        }

        /* map tooltip */
        #expl-tooltip {
            position: fixed;
            background: rgba(20,20,20,0.88);
            color: #fff;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 9999;
            line-height: 1.5;
        }

    <script>
        const INDIA_STATES_GEOJSON_URL = "https://gist.githubusercontent.com/jbrobst/56c13bbbf9d97d187fea01ca62ea5112/raw/e388c4cae20aa53cb5090210a42ebb9b765c0a36/india_states.geojson";
        const NEPAL_GEOJSON_URL = "https://raw.githubusercontent.com/Acesmndr/nepal-geojson/master/generated-geojson/nepal-acesmndr.geojson";

        const svg     = d3.select("#india-svg");
        const tooltip = d3.select("#expl-tooltip");

        // ── Build sidebar list ────────────────────────────────────────────
        const listBody = document.getElementById("places-list-body");
        document.getElementById("places-count").textContent = `(${VISITED_PLACES.length})`;

        VISITED_PLACES.forEach((p, i) => {
            const row = document.createElement("div");
            row.className = "place-row";
            row.dataset.index = i;
            row.innerHTML = `<span class="pr-icon">📍</span>
                             <div><div class="pr-name">${p.name}</div>
                             <div class="pr-state">${p.state}</div></div>`;
            listBody.appendChild(row);
        });

        function highlightRow(idx) {
            document.querySelectorAll(".place-row").forEach(r => r.style.background = "");
            const el = listBody.querySelector(`[data-index="${idx}"]`);
            if (el) {
                el.style.background = "#fff8e1";
                el.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        }

        // ── Map render ────────────────────────────────────────────────────
        function renderIndiaMap(indiaData, nepalData) {
            const container = document.getElementById("map-svg-container");
            const W = container.clientWidth;
            const H = container.clientHeight || Math.max(420, W * 0.85);

            const scale = Math.min(W, H) * 1.3;
            const projection = d3.geoMercator()
                .center([82, 22])
                .scale(scale)
                .translate([W * 0.44, H * 0.52]);

            const path = d3.geoPath().projection(projection);

            svg.attr("width", W).attr("height", H);
            svg.selectAll("*").remove();

            // The map is built in three layers: a gradient base, the muted
            // coating, and state outlines drawn above both. Visited places
            // punch compact square reveals through the coating.
            const scratchSize = Math.max(7, Math.min(W, H) * 0.014);
            const defs = svg.append("defs");
            const gradient = defs.append("linearGradient")
                .attr("id", "visited-gradient")
                .attr("gradientUnits", "userSpaceOnUse")
                .attr("x1", 0).attr("y1", H)
                .attr("x2", W).attr("y2", 0);

            <!--     Use 0, 25, 50, 75, 100       -->
            gradient.append("stop").attr("offset", "30%").attr("stop-color", "#4f42a5");
            gradient.append("stop").attr("offset", "40%").attr("stop-color", "#7c3aed");
            gradient.append("stop").attr("offset", "50%").attr("stop-color", "#2563eb");
            gradient.append("stop").attr("offset", "60%").attr("stop-color", "#06b6d4");
            gradient.append("stop").attr("offset", "70%").attr("stop-color", "#0fd0ed");

            const gradientBorder = defs.append("linearGradient")
                .attr("id", "visited-gradient-border")
                .attr("gradientUnits", "userSpaceOnUse")
                .attr("x1", 0).attr("y1", H)
                .attr("x2", W).attr("y2", 0);

            gradientBorder.append("stop").attr("offset", "30%").attr("stop-color", "#180d68");
            gradientBorder.append("stop").attr("offset", "40%").attr("stop-color", "#5723b3");
            gradientBorder.append("stop").attr("offset", "50%").attr("stop-color", "#1747ae");
            gradientBorder.append("stop").attr("offset", "60%").attr("stop-color", "#087f98");
            gradientBorder.append("stop").attr("offset", "70%").attr("stop-color", "#1298ad");

            const mask = defs.append("mask")
                .attr("id", "visited-reveal-mask")
                .attr("maskUnits", "userSpaceOnUse")
                .attr("x", 0).attr("y", 0).attr("width", W).attr("height", H);

            mask.append("rect")
                .attr("class", "mask-coating")
                .attr("width", W).attr("height", H)
                .attr("fill", "white");

            mask.selectAll("rect.scratch-reveal")
                .data(VISITED_PLACES)
                .enter().append("rect")
                .attr("class", "scratch-reveal")
                .attr("x", d => projection([d.lng, d.lat])[0] - scratchSize / 2)
                .attr("y", d => projection([d.lng, d.lat])[1] - scratchSize / 2)
                .attr("width", scratchSize)
                .attr("height", scratchSize)
                .attr("fill", "black");

            // The Nepal source uses the opposite polygon winding from D3's
            // spherical GeoJSON convention. Reverse its exterior ring so the
            // country itself is filled instead of the surrounding canvas.
            const nepalShape = {
                ...nepalData,
                geometry: {
                    ...nepalData.geometry,
                    coordinates: nepalData.geometry.coordinates.map(ring => [...ring].reverse())
                }
            };

            // India retains its state-level boundaries; Nepal is rendered as
            // one additional country shape so Nepal visits can be scratched too.
            const mapShapes = [
                ...indiaData.features.map(feature => ({ ...feature, mapCountry: "india" })),
                { ...nepalShape, mapCountry: "nepal" }
            ];
            const statePaths = selection => selection
                .data(mapShapes)
                .enter().append("path")
                .attr("d", path)
                .attr("fill-rule", "evenodd");

            statePaths(svg.append("g").attr("class", "map-gradient-layer").selectAll("path"))
                .attr("fill", "url(#visited-gradient)");

            statePaths(svg.append("g").attr("class", "map-gradient-boundaries").selectAll("path"))
                .attr("fill", "none")
                .attr("stroke", "url(#visited-gradient-border)")
                .attr("stroke-width", 0.65)
                .attr("vector-effect", "non-scaling-stroke");

            statePaths(svg.append("g")
                .attr("class", "map-coating-layer")
                .attr("mask", "url(#visited-reveal-mask)")
                .selectAll("path"))
                .attr("fill", d => d.mapCountry === "nepal" ? "#EBF8FF" : "#d8ecfa");

            statePaths(svg.append("g")
                .attr("class", "map-boundaries")
                .attr("mask", "url(#visited-reveal-mask)")
                .selectAll("path"))
                .attr("fill", "none")
                .attr("stroke", "#7ab8d9")
                .attr("stroke-width", 0.65)
                .attr("vector-effect", "non-scaling-stroke");

            // Invisible hit areas retain the useful tooltip and list linking
            // without adding visible markers above the scratch reveals.
            svg.append("g").attr("class", "visited-place-targets").selectAll("rect")
                .data(VISITED_PLACES)
                .enter().append("rect")
                .attr("x", d => projection([d.lng, d.lat])[0] - scratchSize / 2)
                .attr("y", d => projection([d.lng, d.lat])[1] - scratchSize / 2)
                .attr("width", scratchSize)
                .attr("height", scratchSize)
                .attr("fill", "transparent")
                .style("cursor", "pointer")
                .on("mouseover", (event, d) => {
                    tooltip.style("display", "block")
                        .html(`<strong>${d.name}</strong><br>${d.state}`);
                })
                .on("mousemove", event => {
                    tooltip.style("left", (event.clientX + 14) + "px")
                           .style("top",  (event.clientY - 34) + "px");
                })
                .on("mouseout", event => {
                    tooltip.style("display", "none");
                })
                .on("click", (event, d) => {
                    highlightRow(VISITED_PLACES.indexOf(d));
                });
        }

        // ── Trip stories ─────────────────────────────────────────────────
        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
            })[char]);
        }

        function renderTripStories() {
            const container = document.getElementById("trip-stories");

            container.innerHTML = TRIPS.map(trip => {
                const panelId = `trip-${trip.id}`;
                const route = trip.route.map((stop, index) =>
                    `${index ? '<span class="trip-route-arrow" aria-hidden="true">→</span>' : ''}<span class="trip-stop">${escapeHtml(stop)}</span>`
                ).join("");
                const story = trip.story.trim()
                    ? `<p class="trip-story">${escapeHtml(trip.story)}</p>`
                    : "";

                return `<article class="trip-card">
                    <button class="trip-toggle" type="button" aria-expanded="false" aria-controls="${panelId}">
                        <span class="trip-title-wrap"><span class="trip-label">${escapeHtml(trip.label)}</span><span class="trip-title">${escapeHtml(trip.title)}</span></span>
                        <i class="fas fa-chevron-down trip-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="trip-panel" id="${panelId}" hidden>
                        <div class="trip-route">${route}</div>
                        ${story}
                    </div>
                </article>`;
            }).join("");

            container.querySelectorAll(".trip-toggle").forEach(button => {
                button.addEventListener("click", () => {
                    const willExpand = button.getAttribute("aria-expanded") !== "true";
                    container.querySelectorAll(".trip-toggle").forEach(otherButton => {
                        otherButton.setAttribute("aria-expanded", "false");
                        document.getElementById(otherButton.getAttribute("aria-controls")).hidden = true;
                    });
                    if (willExpand) {
                        button.setAttribute("aria-expanded", "true");
                        document.getElementById(button.getAttribute("aria-controls")).hidden = false;
                    }
                });
            });
        }

        function renderWorldFlags() {
            document.getElementById("world-flags").innerHTML = WORLD_FLAGS.map(group => `
                <div class="flag-subsection">
                    <h5>${escapeHtml(group.title)}</h5>
                    <div class="flags-row">${group.countries.map(country => `
                        <div class="flag-card${country.next ? " next" : ""}">
                            <span class="flag-emoji">${escapeHtml(country.flag)}</span>
                            <span class="flag-name">${escapeHtml(country.name)}</span>
                            ${country.next ? '<span class="next-badge">NEXT</span>' : ""}
                        </div>`).join("")}
                    </div>
                </div>`).join("");
        }

        // Compact, shared line-art vocabulary for Adventure Log entries.
        const ADVENTURE_ART = {
            jump: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M10 15Q32 2 54 15M10 15l22 10 22-10M19 16l13 9 13-9M32 25v8m-4 8 4-8 4 8M25 29l7 4 7-4"/><circle cx="32" cy="37" r="2"/></svg>`,
            raft: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M11 29h42l-6 9H17zM18 33h30M20 29l5-11m19 11-5-11M16 40q5-4 10 0t10 0 10 0 10 0M12 44q5-3 10 0t10 0 10 0 10 0"/><circle cx="27" cy="24" r="2"/><circle cx="37" cy="24" r="2"/></svg>`,
            glide: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M9 14Q32 2 55 14L32 23zM18 15l13 20m15-20L34 35M24 10l8 13 8-13M32 23v11m-5 8 5-8 5 8M25 29l7 5 7-5"/><circle cx="32" cy="38" r="2"/></svg>`,
            "zip-lining": `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M6 9h52M12 9v12m40-12v12M28 9l5 9 7 14M33 18l-7 5m8-5 5 6M40 32l7 10M10 43h44"/><circle cx="33" cy="16" r="2.5"/><circle cx="34" cy="27" r="2"/></svg>`,
            "jet-ski": `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M12 32h31l9 5H21zM28 32l5-13h8l4 13M34 19l5-5m-8 6 7 5M17 36h29M9 41q7-5 14 0t14 0 14 0 14 0"/><circle cx="37" cy="17" r="2"/></svg>`,
            snorkel: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M16 25q16-11 32 0v10H16zM32 25v10M20 29h9m6 0h9M48 26h6V14h-5M14 41q9-5 18 0t18 0"/><circle cx="49" cy="11" r="2"/><circle cx="55" cy="8" r="1.3"/></svg>`,
            trek: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M7 39 23 14l11 15 7-10 16 20M19 39l8-11 7 11M12 43h40M45 33l3-8 3 8M48 25v18"/><circle cx="50" cy="10" r="3"/></svg>`,
            kayak: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M11 29q21 10 42 0-20 17-42 0zM17 18l31 22M13 22l6-7m25 29 7-7M22 31h20M9 40q7-5 14 0t14 0 14 0M12 44q7-3 14 0t14 0 14 0"/></svg>`,
            sky: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M10 14Q32 2 54 14L32 24zM18 16l14 8 14-8M25 10l7 14 7-14M32 24v10m-5 8 5-8 5 8M24 29l8 5 8-5"/><circle cx="32" cy="38" r="2"/></svg>`,
            scuba: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M12 28h28l9 5-9 6H20zM25 28v-8h13v8M21 34l-5 5m18-5 6 5M15 42q8-5 16 0t16 0"/><circle cx="48" cy="18" r="2"/><circle cx="54" cy="12" r="1.5"/><path d="M39 21h4v10h-4z"/></svg>`,
            ski: `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M9 39 26 13l9 12 7-8 13 22M18 43l27-8M24 44l27-8M33 27l-4 12m7-11 8 10"/><circle cx="48" cy="10" r="2"/><path d="M12 15h5m-2-2v5"/></svg>`
        };

        function adventureArt(kind) {
            return ADVENTURE_ART[kind] || ADVENTURE_ART.trek;
        }

        function renderBucketList() {
            document.getElementById("bucket-list").innerHTML = BUCKET_LIST.map(group => `
                <div class="bucket-col">
                    <h3 class="log-group-heading">${group.status === "done" ? "Completed" : "Next Up"}</h3>
                    ${group.items.map(item => `
                        <article class="adventure-item ${escapeHtml(group.status)}">
                            <span class="adv-marker" aria-hidden="true"></span>
                            <div class="adv-body">
                                <div class="adv-name">${escapeHtml(item.name)}</div>
                                ${item.place ? `<div class="adv-place">${escapeHtml(item.place)}</div>` : ""}
                            </div>
                            <div class="adv-art">${adventureArt(item.art)}</div>
                        </article>`).join("")}
                </div>`).join("");
        }

        renderWorldFlags();
        renderTripStories();
        renderBucketList();

        // ── Load & resize ─────────────────────────────────────────────────
        Promise.all([
            d3.json(INDIA_STATES_GEOJSON_URL),
            d3.json(NEPAL_GEOJSON_URL)
        ]).then(([indiaData, nepalData]) => {
            // set container height = 85% of its width for nice aspect ratio
            const container = document.getElementById("map-svg-container");
            container.style.height = Math.max(420, container.clientWidth * 0.85) + "px";

            renderIndiaMap(indiaData, nepalData);

            let t;
            window.addEventListener("resize", () => {
                clearTimeout(t);
                t = setTimeout(() => {
                    container.style.height = Math.max(420, container.clientWidth * 0.85) + "px";
                    renderIndiaMap(indiaData, nepalData);
                }, 150);
            });
        });
    </script>

</body>
</html>
